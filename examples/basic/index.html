<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>K-Link Call SDK — Basic Example</title>
		<style>
			:root {
				font-family: system-ui, -apple-system, sans-serif;
				color: #1a1a2e;
			}
			body {
				margin: 0;
				background: #f4f5f7;
				display: flex;
				justify-content: center;
				padding: 24px 16px;
			}
			main {
				width: 100%;
				max-width: 460px;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}
			.card {
				background: #fff;
				border: 1px solid #e2e4e9;
				border-radius: 12px;
				padding: 16px;
			}
			.card h2 {
				margin: 0 0 10px;
				font-size: 14px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: #6b7280;
			}
			label {
				display: block;
				font-size: 12px;
				color: #6b7280;
				margin: 8px 0 2px;
			}
			input {
				width: 100%;
				box-sizing: border-box;
				padding: 8px 10px;
				border: 1px solid #d1d5db;
				border-radius: 8px;
				font-size: 14px;
			}
			button {
				padding: 8px 14px;
				border: none;
				border-radius: 8px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				background: #2563eb;
				color: #fff;
			}
			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			button.secondary {
				background: #e5e7eb;
				color: #1f2937;
			}
			button.danger {
				background: #dc2626;
			}
			button.success {
				background: #16a34a;
			}
			.row {
				display: flex;
				gap: 8px;
				margin-top: 12px;
				flex-wrap: wrap;
			}
			.badges {
				display: flex;
				gap: 8px;
				margin-top: 12px;
			}
			.badge {
				font-size: 12px;
				padding: 2px 10px;
				border-radius: 999px;
				background: #f3f4f6;
				color: #6b7280;
			}
			.badge.on {
				background: #dcfce7;
				color: #15803d;
			}
			#incoming-panel,
			#active-panel {
				display: none;
			}
			.call-number {
				font-size: 20px;
				font-weight: 700;
				margin: 4px 0;
			}
			.call-meta {
				font-size: 12px;
				color: #6b7280;
			}
			#log {
				font-family: ui-monospace, monospace;
				font-size: 11px;
				background: #0f172a;
				color: #cbd5e1;
				border-radius: 8px;
				padding: 10px;
				height: 180px;
				overflow-y: auto;
				white-space: pre-wrap;
				word-break: break-all;
			}
		</style>
	</head>
	<body>
		<main>
			<!-- Step 1: connect -->
			<section class="card" id="connect-card">
				<h2>1 · Connect</h2>
				<label for="api-base">API base URL</label>
				<input id="api-base" value="https://apigw.klinkcx.com" />
				<label for="email">Extension email</label>
				<input id="email" placeholder="agent@yourcompany.com" value="tun@klink.cloud" />
				<label for="token">API token (kpt_…)</label>
				<input id="token" type="password" placeholder="kpt_xxxxxxxx" />
				<div class="row">
					<button id="btn-connect">Connect</button>
					<button id="btn-disconnect" class="secondary" disabled>
						Disconnect
					</button>
				</div>
				<div class="badges">
					<span class="badge" id="badge-socket">socket: down</span>
					<span class="badge" id="badge-reg">extension: unregistered</span>
				</div>
			</section>

			<!-- Step 2: dial -->
			<section class="card">
				<h2>2 · Dial</h2>
				<label for="dial-number">Number</label>
				<input id="dial-number" placeholder="+6591234567" />
				<div class="row">
					<button id="btn-call" disabled>Call</button>
				</div>
			</section>

			<!-- Incoming call -->
			<section class="card" id="incoming-panel">
				<h2>Incoming call</h2>
				<div class="call-number" id="incoming-number">—</div>
				<div class="call-meta" id="incoming-name"></div>
				<div class="row">
					<button id="btn-answer" class="success">Answer</button>
					<button id="btn-reject" class="danger">Reject</button>
				</div>
			</section>

			<!-- Active call -->
			<section class="card" id="active-panel">
				<h2>Active call</h2>
				<div class="call-number" id="active-number">—</div>
				<div class="call-meta" id="active-status"></div>
				<div class="row">
					<button id="btn-hangup" class="danger">Hang up</button>
					<button id="btn-mute" class="secondary">Mute</button>
					<button id="btn-hold" class="secondary">Hold</button>
				</div>
				<label for="dtmf-input">DTMF</label>
				<div class="row" style="margin-top: 4px">
					<input
						id="dtmf-input"
						placeholder="e.g. 1"
						style="max-width: 120px"
					/>
					<button id="btn-dtmf" class="secondary">Send</button>
				</div>
			</section>

			<!-- Event log -->
			<section class="card">
				<h2>Event log</h2>
				<div id="log"></div>
			</section>

			<!-- Remote call audio is attached here -->
			<audio id="remote-audio" autoplay></audio>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
